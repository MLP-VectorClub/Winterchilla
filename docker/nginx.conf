# Pod-local nginx for Winterchilla (read-only mode): static assets + fastcgi to php-fpm on 127.0.0.1:9000 (same pod).
# TLS, host routing (www./old.mlpvector.club) and the public listener are the ingress controller's job.
server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # client address as seen by the ingress controller (pod network)
    set_real_ip_from 10.244.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 1m;
    large_client_header_buffers 4 32k;

    # The site is a read-only archive: search engines should list the new one (robots.txt stays open so crawlers can see this)
    add_header X-Robots-Tag "noindex" always;

    # Read-only mode: the legacy site only shows data, every state-changing method is refused with a JSON 405
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }
    error_page 405 @read_only;
    location @read_only {
        default_type application/json;
        add_header Allow "GET, HEAD, OPTIONS" always;
        return 405 '{"message":"This site is read-only.","readOnly":true}';
    }

    # health probe (php-fpm + PostgreSQL + Valkey), not routed through the app router
    location = /health {
        access_log off;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/health.php;
        fastcgi_param SCRIPT_NAME /health.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 10;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # legacy build output paths, gone for good
    location ^~ /js/min { return 410; }
    location ^~ /scss/min { return 410; }

    location ~ ^/(js|css|img|font)/ {
        access_log off;
        try_files $uri =404;
    }

    # also used by Celestia (mlpvector.club/dist)
    location /dist {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public" always;
        add_header X-Robots-Tag "noindex" always;
        etag on;
        expires 0;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /api {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json image/svg+xml;
    gzip_vary on;

    error_page 404 /404;
    error_page 403 /404;

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_read_timeout 60;
    }
    # no other PHP file is executable from the web
    location ~ \.php$ {
        return 404;
    }
}
