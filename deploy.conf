# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`,
# with cwd set to this worktree. See that repo's template/deploy.conf.example
# for the full contract ($WORKTREE/$BRANCH/$GIT_DIR/$oldrev/$newrev).
#
# Ported from the old setup/post-receive.sh: composer install and phinx
# migrations on every deploy, pnpm install only when the lockfile changed,
# asset rebuild when the lockfile or assets/ changed, API schema
# regeneration when the API controllers changed, then clear the cached
# commit info. No service restart — php-fpm serves whatever's on disk.

# changed <regex>: did a file matching it change in this push? On a first
# push ($oldrev all zeros) there's nothing to diff against, so everything
# counts. (grep > /dev/null, not grep -q: -q exits early, git diff dies of
# SIGPIPE, and pipefail would turn a match into "not changed".)
changed() {
  [[ "$oldrev" =~ ^0+$ ]] && return 0
  git --git-dir="$GIT_DIR" diff --name-only "$oldrev" "$newrev" | grep "$1" > /dev/null
}

deploy_build() {
  if [[ -d vendor/ ]]; then
    sudo chmod -R ug+rw vendor/
  fi
  composer install --no-dev --no-interaction 2>&1

  # A read-only site reads Luna's database, whose schema Luna's migrations own: phinx must not touch it (it has no phinxlog there and would try to build everything)
  if grep -qx 'READ_ONLY=true' .env; then
    echo "git-deploy: skipping phinx migrate, the site is read-only"
  else
    vendor/bin/phinx migrate
  fi

  if changed '^pnpm-lock\.yaml$'; then
    pnpm install --prod --frozen-lockfile
  else
    echo "git-deploy: skipping pnpm install, lockfile not modified"
  fi

  if changed '^\(pnpm-lock\.yaml$\|assets/\)'; then
    nice pnpm run build
  else
    echo "git-deploy: skipping asset rebuild, pnpm-lock.yaml and assets/ unchanged"
  fi

  php -f scripts/clear_redis_keys.php commit_info
}
